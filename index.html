    color: #24292f;
    max-width: 700px;
    margin: 60px auto;
    padding: 0 20px;

    text-align: left;

    border: 1px solid #d0d7de;
  }
  th {
    background-color: #eaeef2;
    width: 160px;
    white-space: nowrap;

</head>
